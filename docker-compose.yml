services:
  db:
    image: postgres:16-alpine
    container_name: awty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - awty-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: development
    container_name: awty-migrate
    restart: 'no'
    command: ['npx', 'drizzle-kit', 'migrate']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    networks:
      - awty-network
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: development
    container_name: awty-app
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    networks:
      - awty-network
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: development
    container_name: awty-worker
    restart: unless-stopped
    command: ['npm', 'run', 'worker']
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    networks:
      - awty-network
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
    name: awty-postgres-data
    driver: local

networks:
  awty-network:
    driver: bridge
